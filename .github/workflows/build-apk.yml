name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

# 关键：声明写权限，否则 gh release 会报 403
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386

      - name: Build APK with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
          build-root-directory: android-app
          cache-disabled: true

      - name: Publish APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest android-app/app/build/outputs/apk/debug/app-debug.apk \
            --title "多控助手 APK" \
            --notes "手机点开下方 app-debug.apk 即可下载安装。安装后打开 App 填写服务器地址、允许录屏并开启无障碍权限。"
